upstream temperament_app {
    server temperament_web:8000;
}

upstream temperament_pgadmin_app {
    server temperament_pgadmin:80;
}

server {
    listen 80;
    server_name 172.26.4.9;

    client_max_body_size 50M;
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    location /logic-trainer/ {
        proxy_pass http://temperament_app/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /logic-trainer/pgadmin/ {
        proxy_pass http://temperament_pgadmin_app/;
        proxy_set_header X-Script-Name /logic-trainer/pgadmin/;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /logic-trainer/static/ {
        alias /app/static/;
        expires 30d;
        access_log off;
    }

    location /logic-trainer/media/ {
        alias /app/media/;
        expires 30d;
        access_log off;
    }
}