services:
  web:
    build:
      context: .
      dockerfile: _docker/app/Dockerfile
    container_name: temperament_web
    command: gunicorn temperament_backend.wsgi:application --bind 0.0.0.0:8000
    volumes:
      - static_volume:/app/static
      - media_volume:/app/media
    expose:
      - 8000
    depends_on:
      - db
    env_file:
      - .env

  db:
    image: postgres:15
    container_name: temperament_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    env_file:
      - .env

  pgadmin:
    image: dpage/pgadmin4
    container_name: temperament_pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - db

  nginx:
    image: nginx:latest
    container_name: temperament_nginx
    ports:
      - "8083:80" # 8083 порт
    volumes:
      - ./_docker/nginx/conf.d/nginx.conf:/etc/nginx/conf.d/default.conf
      - static_volume:/app/static
      - media_volume:/app/media
    depends_on:
      - web
      - pgadmin
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  postgres_data:
  static_volume:
  media_volume:
  pgadmin_data: